name: Build & Release LockedSecure

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: 'SemVer tag to simulate in dry-run mode (e.g. v2.0.0; never publishes a release)'
        required: true
        default: 'v2.0.0'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Checkout repository sources for validation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build environment
        uses: ./.github/actions/setup-android-env # zizmor: ignore[self-repository] -- actionlint v1.7.12 requires './' syntax for local composite actions
        with:
          cache-disabled: 'true'

      - name: Run Spotless, Detekt, Lint & Unit Tests
        run: ./gradlew spotlessCheck detekt lint test --no-daemon

  release:
    name: Build, Verify & Publish Signed Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write # Create and publish draft GitHub Release with APK, SBOM, and checksums
      id-token: write # Mint OIDC token for SLSA build provenance attestation
      attestations: write # Persist Sigstore build provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Android build environment
        uses: ./.github/actions/setup-android-env # zizmor: ignore[self-repository] -- actionlint v1.7.12 requires './' syntax for local composite actions
        with:
          cache-disabled: 'true'

      - name: Derive deterministic SemVer versionName and versionCode
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: Tag '$RAW_TAG' must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          CLEAN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          {
            echo "RELEASE_TAG=$RAW_TAG"
            echo "APP_VERSION_NAME=$CLEAN_VERSION"
            echo "APP_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Decode signing keystore to temporary runner storage
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          umask 077
          KEYSTORE_PATH="$(mktemp "${RUNNER_TEMP}/keystore-XXXXXX.jks")"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_SIGNING_KEY_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed universal release APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-build-cache \
            --no-daemon

      - name: Shred temporary keystore
        if: always()
        run: |
          if [ -n "${ANDROID_SIGNING_KEY_FILE:-}" ] && [ -f "$ANDROID_SIGNING_KEY_FILE" ]; then
            shred -u "$ANDROID_SIGNING_KEY_FILE" || rm -f "$ANDROID_SIGNING_KEY_FILE"
          fi

      - name: Stage and verify release APK
        run: |
          mkdir -p release-artifacts
          FINAL_APK="release-artifacts/locked-secure-${RELEASE_TAG}-universal.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FINAL_APK"
          bash scripts/verify_release_apk.sh "$FINAL_APK" "$APP_VERSION_NAME" "$APP_VERSION_CODE" 153600

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: release-artifacts/sbom.cdx.json
          upload-artifact: false

      - name: Generate SHA-256 checksums
        run: |
          (
            cd release-artifacts
            sha256sum "locked-secure-${RELEASE_TAG}-universal.apk" sbom.cdx.json > SHA256SUMS.txt
          )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/locked-secure-*.apk

      - name: Publish release idempotently (draft then publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE="release-artifacts/locked-secure-${RELEASE_TAG}-universal.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$APK_FILE" \
              release-artifacts/sbom.cdx.json \
              release-artifacts/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$APK_FILE" \
              release-artifacts/sbom.cdx.json \
              release-artifacts/SHA256SUMS.txt \
              --draft \
              --title "Release ${RELEASE_TAG}" \
              --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false

  dry-run:
    name: Dry-Run Release Pipeline (Ephemeral Signing)
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # Checkout repository sources for dry-run verification
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android build environment
        uses: ./.github/actions/setup-android-env # zizmor: ignore[self-repository] -- actionlint v1.7.12 requires './' syntax for local composite actions
        with:
          cache-disabled: 'true'

      - name: Validate and derive dry-run SemVer version
        env:
          RAW_TAG: ${{ inputs.dry_run_tag }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: dry_run_tag '$RAW_TAG' must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          CLEAN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          {
            echo "RELEASE_TAG=$RAW_TAG"
            echo "APP_VERSION_NAME=$CLEAN_VERSION"
            echo "APP_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Generate ephemeral dry-run keystore
        run: |
          umask 077
          KEYSTORE_PATH="$(mktemp "${RUNNER_TEMP}/dryrun-XXXXXX.jks")"
          rm -f "$KEYSTORE_PATH"
          EPHEMERAL_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$EPHEMERAL_PASS"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias dryrun \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$EPHEMERAL_PASS" \
            -dname "CN=LockedSecure DryRun,O=CI,C=US" >/dev/null 2>&1
          {
            echo "ANDROID_SIGNING_KEY_FILE=$KEYSTORE_PATH"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$EPHEMERAL_PASS"
            echo "ANDROID_SIGNING_KEY_ALIAS=dryrun"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$EPHEMERAL_PASS"
          } >> "$GITHUB_ENV"

      - name: Build and verify dry-run release APK
        run: |
          ./gradlew assembleRelease --no-build-cache --no-daemon
          mkdir -p release-artifacts
          FINAL_APK="release-artifacts/locked-secure-${RELEASE_TAG}-universal.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FINAL_APK"
          bash scripts/verify_release_apk.sh "$FINAL_APK" "$APP_VERSION_NAME" "$APP_VERSION_CODE" 153600

      - name: Shred ephemeral dry-run keystore
        if: always()
        run: |
          if [ -n "${ANDROID_SIGNING_KEY_FILE:-}" ] && [ -f "$ANDROID_SIGNING_KEY_FILE" ]; then
            shred -u "$ANDROID_SIGNING_KEY_FILE" || rm -f "$ANDROID_SIGNING_KEY_FILE"
          fi

      - name: Generate CycloneDX SBOM (dry-run)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: release-artifacts/sbom.cdx.json
          upload-artifact: false

      - name: Generate SHA-256 checksums (dry-run)
        run: |
          (
            cd release-artifacts
            sha256sum "locked-secure-${RELEASE_TAG}-universal.apk" sbom.cdx.json > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload dry-run verification artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-artifacts
          path: |
            release-artifacts/SHA256SUMS.txt
            release-artifacts/sbom.cdx.json
          retention-days: 5
